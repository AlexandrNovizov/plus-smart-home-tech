spring:
  jpa:
    show_sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer
    username: dbuser
    password: 12345

kafka:
  snapshots:
    "bootstrap.servers": "localhost:9092"
    "key.deserializer": "org.apache.kafka.common.serialization.StringDeserializer"
    "value.deserializer": "ru.yandex.practicum.telemetry.kafka.SensorsSnapshotDeserializer"
    "group.id": "analyzer-1"
    "enable.auto.commit": "false"
  topics:
    "snapshot": '${SNAPSHOT_TOPIC:telemetry.snapshots.v1}'

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext