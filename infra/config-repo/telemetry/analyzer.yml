spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer

kafka:
  snapshots:
    "key.deserializer": "org.apache.kafka.common.serialization.StringDeserializer"
    "value.deserializer": "ru.yandex.practicum.telemetry.kafka.SensorsSnapshotDeserializer"
    "group.id": "analyzer-1"
    "enable.auto.commit": "false"
  hub:
    "key.deserializer": "org.apache.kafka.common.serialization.StringDeserializer"
    "value.deserializer": "ru.yandex.practicum.telemetry.kafka.HubEventDeserializer"
    "group.id": "analyzer-1"
    "enable.auto.commit": "false"
  topics:
    "snapshot": '${SNAPSHOT_TOPIC:telemetry.snapshots.v1}'
    "hub.event": "${HUB_EVENT_TOPIC:telemetry.hubs.v1}"

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext